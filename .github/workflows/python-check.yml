name: Python checks

on:
  push:
    branches:
      - main
      - stabilize-scanner-schedule
      - chatgpt-audit-hardening
      - autonomous-bot-hardening
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile active bot modules
        run: |
          python -m py_compile \
            CryptoMarketClub_channel.py \
            smc_module.py \
            daily_risk.py \
            record_trade.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
