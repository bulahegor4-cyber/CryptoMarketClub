name: Python syntax check

on:
  push:
    branches:
      - main
      - stabilize-scanner-schedule
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile active bot modules
        run: |
          python -m py_compile \
            CryptoMarketClub_channel.py \
            smc_module.py \
            daily_risk.py \
            record_trade.py
